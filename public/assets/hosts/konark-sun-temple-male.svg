<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#151d38" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2b993" />
      <stop offset="100%" stop-color="#c9976e" />
    </linearGradient>
    <linearGradient id="attireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="300" height="380" rx="24" fill="url(#bgGrad)" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2" />

  <!-- Sacred Radiant Aura Halo -->
  <circle cx="150" cy="150" r="110" fill="url(#haloGrad)" filter="url(#glow)" />
  <circle cx="150" cy="150" r="95" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-dasharray="4 4" />

  <!-- Shoulders & Torso Attire -->
  <path d="M 45 380 Q 55 240 150 240 Q 245 240 255 380 Z" fill="url(#attireGrad)" />
  <!-- Regal Zardozi Sash / Collar -->
  <path d="M 120 240 L 150 310 L 180 240 L 205 240 L 150 345 L 95 240 Z" fill="#f59e0b" opacity="0.9" />
  <circle cx="150" cy="310" r="6" fill="#ffffff" />

  <!-- Neck -->
  <rect x="133" y="200" width="34" height="45" rx="6" fill="url(#skinGrad)" />

  <!-- Head Base -->
  <path d="M 105 140 Q 105 215 150 215 Q 195 215 195 140 Q 195 115 150 115 Q 105 115 105 140 Z" fill="url(#skinGrad)" />

  <!-- Royal Beard & Mustache -->
  <path d="M 112 165 C 112 215, 188 215, 188 165 C 175 198, 125 198, 112 165 Z" fill="#261a15" />
  <path d="M 125 168 Q 150 182 175 168 Q 150 174 125 168 Z" fill="#170e0b" />

  <!-- Facial Features -->
  <!-- Eyes -->
  <ellipse cx="132" cy="148" rx="6" ry="4" fill="#ffffff" />
  <ellipse cx="168" cy="148" rx="6" ry="4" fill="#ffffff" />
  <circle cx="132" cy="148" r="3" fill="#1a0f0a" />
  <circle cx="168" cy="148" r="3" fill="#1a0f0a" />
  <!-- Eyebrows -->
  <path d="M 122 140 Q 132 136 142 140" fill="none" stroke="#170e0b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 158 140 Q 168 136 178 140" fill="none" stroke="#170e0b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Nose & Lips -->
  <path d="M 150 146 L 147 160 L 153 160 Z" fill="#b07f59" />

  <!-- Royal Turban / Crown -->
  
            <path d="M 105 125 L 115 85 L 132 105 L 150 75 L 168 105 L 185 85 L 195 125 Z" fill="#f59e0b" stroke="#78350f" stroke-width="2" />
            <circle cx="150" cy="75" r="5" fill="#ffffff" />
            <circle cx="115" cy="85" r="4" fill="#78350f" />
            <circle cx="185" cy="85" r="4" fill="#78350f" />
            

  <!-- Host Name Badge Overlay -->
  <rect x="25" y="325" width="250" height="42" rx="12" fill="#090d1a" opacity="0.92" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5" />
  <text x="150" y="344" text-anchor="middle" fill="#ffffff" font-family="Cinzel, serif" font-weight="bold" font-size="13">King Narasimhadeva I</text>
  <text x="150" y="359" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="600">HISTORICAL MALE HOST</text>
</svg>